[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-bert"
version = "0.1.0"
description = "BERT built from scratch: WordPiece tokenizer, Transformer encoder, pre-training and fine-tuning."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Om Patel" }]
dependencies = ["torch>=2.2", "safetensors>=0.4", "huggingface_hub>=0.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "tokenizers>=0.19", "transformers>=4.40"]
data = ["pyarrow>=15"]

[project.urls]
Repository = "https://github.com/omdkpatel810-ops/mini-bert"

[project.scripts]
minibert = "minibert.cli:main"

[tool.setuptools.packages.find]
include = ["minibert*"]

[tool.setuptools.package-data]
minibert = ["data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/reference"]
markers = ["network: downloads a small real model from the Hugging Face Hub"]

[tool.coverage.run]
source = ["minibert"]
omit = ["minibert/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/reference/google_tokenization.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter decides line length
